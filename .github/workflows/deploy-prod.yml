name: Deploy production

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bootJar
          cp build/libs/*.jar build/libs/backend.jar

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Package release
        run: tar czf release.tar.gz backend/build/libs/backend.jar frontend/dist deploy

      # Upload the release to Alibaba Cloud OSS and sign a short-lived download
      # URL. The server then pulls over that link instead of receiving the
      # artifact directly over SSH — the long-haul GitHub-runner-to-server hop
      # (which kept being flaky, see git history) only has to carry a tiny
      # URL; the actual bytes move over OSS's network.
      - name: Upload release to OSS
        id: oss
        timeout-minutes: 15
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet oss2
          OSS_KEY="deploy/tikviews/${GITHUB_SHA}.tar.gz"
          URL=$(OSS_OBJECT_KEY="$OSS_KEY" python3 <<'PY'
          import os
          import oss2

          key = os.environ["OSS_OBJECT_KEY"]
          auth = oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"], os.environ["OSS_ACCESS_KEY_SECRET"])
          bucket = oss2.Bucket(auth, os.environ["OSS_ENDPOINT"], os.environ["OSS_BUCKET"])
          # Multipart upload in parallel chunks — the runner-to-OSS hop is
          # high-latency, so one giant single-threaded PUT (the old
          # put_object_from_file) could take 10+ minutes even for a small
          # release tarball.
          oss2.resumable_upload(
              bucket,
              key,
              "release.tar.gz",
              multipart_threshold=10 * 1024 * 1024,
              part_size=5 * 1024 * 1024,
              num_threads=4,
          )
          # 1 hour TTL: long enough for the SSH deploy step, short enough that
          # a leaked URL (e.g. in Actions debug logs) stops working quickly.
          print(bucket.sign_url("GET", key, 3600))
          PY
          )
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$OSS_KEY" >> "$GITHUB_OUTPUT"

      # Backend and frontend are deployed as separate steps (each with its own
      # id and health check) so a failure in one doesn't get reported as a
      # single undifferentiated "deploy failed" — see the split Notify steps
      # below, which key off steps.deploy_backend/deploy_frontend.outcome.
      - name: Deploy backend
        id: deploy_backend
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOWNLOAD_URL: ${{ steps.oss.outputs.url }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: DOWNLOAD_URL
          script: |
            set -euo pipefail
            rm -rf ~/tikviews-release && mkdir -p ~/tikviews-release
            curl -fsSL "$DOWNLOAD_URL" -o /tmp/tikviews-release.tar.gz
            tar xzf /tmp/tikviews-release.tar.gz -C ~/tikviews-release
            rm -f /tmp/tikviews-release.tar.gz

            cd "$HOME/tikviews-release"
            mv backend/build/libs/backend.jar backend.jar
            docker compose -f deploy/compose.prod.yml up -d --build backend
            ok=0
            for i in $(seq 1 30); do
              # /api/ping is explicitly public (see AuthFilter), so it works
              # as an unauthenticated health check.
              if docker compose -f deploy/compose.prod.yml exec -T backend wget -qO- http://127.0.0.1:3001/api/ping >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              docker compose -f deploy/compose.prod.yml logs backend --tail=100
              exit 1
            fi

      - name: Deploy frontend
        id: deploy_frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "$HOME/tikviews-release"
            docker compose -f deploy/compose.prod.yml up -d --build --remove-orphans frontend
            ok=0
            for i in $(seq 1 30); do
              # frontend has no host port published (shared nginx proxies to it
              # over app_network by container name), so check from inside it.
              if docker compose -f deploy/compose.prod.yml exec -T frontend wget -qO- http://127.0.0.1/ >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              docker compose -f deploy/compose.prod.yml logs frontend --tail=100
              exit 1
            fi

      # Always remove the uploaded artifact, success or failure, so it
      # doesn't linger in the bucket (belt-and-suspenders alongside a bucket
      # lifecycle rule — see README).
      - name: Clean up OSS artifact
        if: always()
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_OBJECT_KEY: ${{ steps.oss.outputs.key }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_OBJECT_KEY:-}" ]; then exit 0; fi
          python3 <<'PY'
          import os
          import oss2

          auth = oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"], os.environ["OSS_ACCESS_KEY_SECRET"])
          bucket = oss2.Bucket(auth, os.environ["OSS_ENDPOINT"], os.environ["OSS_BUCKET"])
          bucket.delete_object(os.environ["OSS_OBJECT_KEY"])
          PY

      # Push separate WeChat notifications via Server酱 for the backend and
      # frontend deploy results, so a failure in one isn't buried inside a
      # single combined message. Set SERVERCHAN_SENDKEY to enable; without it
      # these steps are no-ops.
      - name: Notify backend success (Server酱)
        if: steps.deploy_backend.outcome == 'success'
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then
            echo "SERVERCHAN_SENDKEY not set — skipping notification."
            exit 0
          fi
          DESP=$(printf '**Commit**: `%s`\n\n**Message**: %s\n\n[查看运行记录](%s)' \
            "${GITHUB_SHA:0:7}" "$COMMIT_MSG" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=✅ tikviews 后端部署成功" \
            --data-urlencode "desp=$DESP" >/dev/null
          echo "Notification sent."

      - name: Notify backend failure (Server酱)
        if: steps.deploy_backend.outcome == 'failure'
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then exit 0; fi
          DESP=$(printf '**Commit**: `%s`\n\n[查看失败日志](%s)' "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=❌ tikviews 后端部署失败" \
            --data-urlencode "desp=$DESP" >/dev/null || true

      - name: Notify frontend success (Server酱)
        if: steps.deploy_frontend.outcome == 'success'
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then
            echo "SERVERCHAN_SENDKEY not set — skipping notification."
            exit 0
          fi
          DESP=$(printf '**Commit**: `%s`\n\n**Message**: %s\n\n[查看运行记录](%s)' \
            "${GITHUB_SHA:0:7}" "$COMMIT_MSG" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=✅ tikviews 前端部署成功" \
            --data-urlencode "desp=$DESP" >/dev/null
          echo "Notification sent."

      - name: Notify frontend failure (Server酱)
        if: steps.deploy_frontend.outcome == 'failure'
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then exit 0; fi
          DESP=$(printf '**Commit**: `%s`\n\n[查看失败日志](%s)' "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=❌ tikviews 前端部署失败" \
            --data-urlencode "desp=$DESP" >/dev/null || true

      # Covers failures before either deploy step ran (build/upload stage),
      # which the backend/frontend-specific notifications above don't see.
      - name: Notify failure (pre-deploy, Server酱)
        if: failure() && steps.deploy_backend.outcome == 'skipped'
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then exit 0; fi
          DESP=$(printf '**Commit**: `%s`\n\n[查看失败日志](%s)' "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=❌ tikviews 部署失败（构建/上传阶段）" \
            --data-urlencode "desp=$DESP" >/dev/null || true
