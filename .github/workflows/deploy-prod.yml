name: Deploy production

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bootJar
          cp build/libs/*.jar build/libs/backend.jar

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "backend/build/libs/backend.jar,frontend/dist/**,deploy/**"
          target: "~/tikviews-release"
          strip_components: 0

      - name: Start production services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -eu
            cd "$HOME/tikviews-release"
            mv backend/build/libs/backend.jar backend.jar
            docker compose -f deploy/compose.prod.yml up -d --build --remove-orphans
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:80/ >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              docker compose -f deploy/compose.prod.yml logs --tail=100
              exit 1
            fi
