spring.application.name=tiktok-vv-query-backend
server.port=3001

# 项目登录密码，4 位数字，可通过 APP_PASSWORD 环境变量覆盖
app.password=${APP_PASSWORD:1122}

ytdlp.executable-path=yt-dlp
ytdlp.timeout-seconds=30
# 仅供后端 yt-dlp 查询 TikTok 视频数据使用；留空时直连
ytdlp.proxy=

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=jdbc:sqlite:./tikviews.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
