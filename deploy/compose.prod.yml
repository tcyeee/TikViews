services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: tikviews-backend
    restart: unless-stopped
    environment:
      # Server can't reach TikTok directly, so yt-dlp goes through the shared
      # clash proxy container on app_network.
      YTDLP_PROXY: http://clash:7890
    volumes:
      - tikviews-data:/data
    networks:
      - tikviews
      - app_network

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: tikviews-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - tikviews
      - app_network

networks:
  tikviews:
  # Shared reverse-proxy network: the host's nginx container reaches us at
  # tikviews-frontend:80 through here instead of us binding host port 80.
  app_network:
    external: true

volumes:
  tikviews-data:
