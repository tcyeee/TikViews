services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      # yt-dlp runs inside this container, so the proxy must be reachable from
      # the backend container (for example, a service name on a shared Docker network).
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    volumes:
      - tikviews-data:/data

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${TIKVIEWS_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  tikviews-data:
